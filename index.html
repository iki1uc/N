<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SYSTEM – STATUS ENGINE</title>

<style>
body { background:#000; color:#0f0; font-family:monospace; padding:40px; }
h1 { color:#6cf; letter-spacing:4px; margin-bottom:30px; }
.block {
    background:#111;
    border:1px solid #333;
    padding:25px;
    margin-bottom:30px;
    border-radius:8px;
}
.grid {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:20px;
}
.item {
    background:#111;
    border:1px solid #333;
    padding:20px;
    border-radius:8px;
    text-align:center;
}
pre {
    background:#111;
    border:1px solid #333;
    padding:20px;
    border-radius:8px;
}
.ok { color:#00ff88; }
.help { color:#ffcc00; }
.error { color:#ff4444; }
.fail { color:#ff0000; }
.miss { color:#ff0066; }
.rdy { color:#66ccff; }
.fit { color:#33ffcc; }
.fix { color:#33cc33; }
</style>
</head>

<body>

<h1>SYSTEM – STATUS ENGINE</h1>

<div class="block">
<pre>
SYSTEM.MODE = REAL‑SCAN
SYSTEM.ACHSE = HELP | ERROR | MISS | FAIL | RDY | FIT | FIX
SYSTEM.STATE = ACTIVE
</pre>
</div>

<div id="output"></div>

<script>
// STATUS‑KLASSEN
function statusClass(r){
  if(r.RESULT === "HELP") return "help";
  if(r.RESULT === "ERROR") return "error";
  if(r.RESULT === "MISS") return "miss";
  if(r.RESULT === "FAIL") return "fail";
  if(r.RESULT === "RDY") return "rdy";
  if(r.RESULT === "FIT") return "fit";
  if(r.RESULT === "FIX") return "fix";
  return "ok";
}

// RENDER
function render(scan){
  const out = document.getElementById("output");
  out.innerHTML = "";

  scan.forEach(r => {
    const box = document.createElement("div");
    box.className = "block";

    box.innerHTML = `
      <h2 class="${statusClass(r)}">${r.NAME}</h2>
      <pre>
ID: ${r.ID}
LAGE: ${JSON.stringify(r.RAUM || {})}
STATUS: ${r.STATUS}
RESULT: ${r.RESULT}
OUT: ${JSON.stringify(r.OUT || {})}
WAHRHEIT: ${r.WAHRHEIT || "?"}
EDIT: ${r.IST_IST || "?"}
      </pre>
    `;
    out.appendChild(box);
  });
}

// START
fetch("/SYSTEM/SCAN.json")
  .then(r => r.json())
  .then(data => render(data));
</script>

</body>
</html>
