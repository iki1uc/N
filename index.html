  font-size: 1.25rem;
  line-height: 1.75rem;
}
.text-xs{
  font-size: 0.75rem;
  line-height: 1rem;
}
.font-bold{
  font-weight: 700;
}
.font-extrabold{
  font-weight: 800;
}
.font-normal{
  font-weight: 400;
}
.uppercase{
  text-transform: uppercase;
}
.normal-case{
  text-transform: none;
}
.leading-none{
  line-height: 1;
}
.leading-relaxed{
  line-height: 1.625;
}
.leading-tight{
  line-height: 1.25;
}
.tracking-\[0\.14em\]{
  letter-spacing: 0.14em;
}
.tracking-\[0\.18em\]{
  letter-spacing: 0.18em;
}
.tracking-\[0\.2em\]{
  letter-spacing: 0.2em;
}
.tracking-\[0\.3em\]{
  letter-spacing: 0.3em;
}
.tracking-normal{
  letter-spacing: 0em;
}
.tracking-wider{
  letter-spacing: 0.05em;
}
.tracking-widest{
  letter-spacing: 0.1em;
}
.text-\[var\(--accent\)\]{
  color: var(--accent);
}
.text-\[var\(--danger\)\]{
  color: var(--danger);
}
.text-\[var\(--ink\)\]{
  color: var(--ink);
}
.text-\[var\(--muted\)\]{
  color: var(--muted);
}
.text-\[var\(--warn\)\]{
  color: var(--warn);
}

  text-decoration-line: line-through;
}
.opacity-30{
  opacity: 0.3;
}
.opacity-70{
  opacity: 0.7;
}
.filter{
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);

.transition-colors{
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}
:root {
  --bg: #e9efe6;
  --surface: #f5f8f1;
  --surface2: #e2ebdb;
  --line: #bfcfb8;
  --ink: #13231a;
  --muted: #5b7060;
  --accent: #0b9d57;
  --accent-soft: rgba(11, 157, 87, 0.13);
  --accent-ink: #eafff3;
  --warn: #a86a00;
  --danger: #c22e4a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #04080a;
    --bg2: #050a06;
    --surface: #080d09;
    --surface2: #0b120c;
    --line: #1d2b1f;
    --ink: #d3ecd9;
    --muted: #6d826d;
    --accent: #2bff88;
    --accent-soft: rgba(43, 255, 136, 0.12);
    --accent-ink: #03130a;
    --warn: #ffb02e;
    --danger: #ff5470;
  }
}
html {
  background: var(--bg);
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  -webkit-font-smoothing: antialiased;
}
::-moz-selection {
  background: var(--accent);
  color: var(--accent-ink);
}
::selection {
  background: var(--accent);
  color: var(--accent-ink);
}
.tnum {
  font-variant-numeric: tabular-nums;
}
.shell-grid {
  background-image:
    linear-gradient(color-mix(in srgb, var(--line) 42%, transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in srgb, var(--line) 42%, transparent) 1px, transparent 1px);
  background-size: 44px 44px;
}
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
}
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  padding: 0.55rem 0.75rem;
  border-bottom: 1px solid var(--line);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  border: 1px solid var(--line);
  background: var(--surface2);
  color: var(--ink);
  padding: 0.45rem 0.7rem;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
  -webkit-user-select: none;
     -moz-user-select: none;
          user-select: none;
  white-space: nowrap;
}
.btn:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent);
}
.btn:disabled {
  opacity: 0.38;
  cursor: not-allowed;
}
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-weight: 800;
}
.btn-primary:hover:not(:disabled) {
  background: var(--accent);
  color: var(--accent-ink);
  filter: brightness(1.1);
}
.btn-danger:hover:not(:disabled) {
  border-color: var(--danger);
  color: var(--danger);
}
.inp {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--line);
  color: var(--ink);
  padding: 0.45rem 0.55rem;
  font-size: 13px;
  outline: none;
  border-radius: 0;
}
.inp:focus {
  border-color: var(--accent);
}
.inp::-moz-placeholder {
  color: var(--muted);
  opacity: 0.75;
}
.inp::placeholder {
  color: var(--muted);
  opacity: 0.75;
}
textarea.inp {
  resize: vertical;
  line-height: 1.5;
}
select.inp {
  -webkit-appearance: none;
     -moz-appearance: none;
          appearance: none;
}
.chip {
  display: inline-flex;
  align-items: baseline;
  gap: 0.4rem;
  border: 1px solid var(--line);
  background: var(--surface);
  padding: 0.3rem 0.55rem;
  font-size: 11px;
  letter-spacing: 0.08em;
}
.chip b {
  color: var(--accent);
  font-weight: 800;
}
@keyframes cellpulse {
  0%, 100% {
    box-shadow: 0 0 0 0 var(--accent-soft);
  }
  50% {
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
}
.cell-last {
  outline: 1px solid var(--accent);
  outline-offset: -1px;
  animation: cellpulse 1.15s ease-in-out infinite;
}
.cell-sel {
  outline: 1px solid var(--ink);
  outline-offset: -1px;
}
.log-scroll::-webkit-scrollbar,
.thin-scroll::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
.log-scroll::-webkit-scrollbar-thumb,
.thin-scroll::-webkit-scrollbar-thumb {
  background: var(--line);
}
.log-scroll::-webkit-scrollbar-track,
.thin-scroll::-webkit-scrollbar-track {
  background: transparent;
}
@keyframes blinkdot {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.25;
  }
}
.blink {
  animation: blinkdot 1.4s steps(2, end) infinite;
}
.hover\:bg-\[var\(--surface2\)\]:hover{
  background-color: var(--surface2);
}
@media (min-width: 640px){
  .sm\:grid-cols-9{
    grid-template-columns: repeat(9, minmax(0, 1fr));
  }
  .sm\:p-3{
    padding: 0.75rem;
  }
  .sm\:px-4{
    padding-left: 1rem;
    padding-right: 1rem;
  }
  .sm\:text-lg{

    line-height: 1.75rem;
  }
  .sm\:text-sm{
    font-size: 0.875rem;
    line-height: 1.25rem;
  }
}

  .lg\:grid-cols-\[220px_minmax\(0\2c 1fr\)\]{
